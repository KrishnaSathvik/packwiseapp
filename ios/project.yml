name: PackWise
options:
  bundleIdPrefix: com.packwise
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  MARKETING_VERSION: 0.1.0
  CURRENT_PROJECT_VERSION: 1
  SWIFT_VERSION: "6.0"
  IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  PackWise:
    type: application
    platform: iOS
    sources:
      - path: PackWise
      - path: ../shared/catalog
        group: Shared/Catalog
        buildPhase: resources
        includes:
          - "*.json"
      - path: ../shared/rules
        group: Shared/Rules
        buildPhase: resources
        includes:
          - "*.json"
      - path: ../shared/fixtures
        group: Shared/Fixtures
        buildPhase: resources
        includes:
          - "**/*.json"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.packwiseapp.app
        PRODUCT_NAME: PackWise
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
      configs:
        # Debug builds are signed locally, so they attest in Apple's development
        # environment and must talk to the deployment that expects it.
        Debug:
          PACKWISE_API_BASE_URL: https://packwiseapp-dev.vercel.app
          PACKWISE_REQUIRE_ATTESTATION: "YES"
          PACKWISE_APPATTEST_ENV: development
        # Release covers TestFlight and the App Store, which always attest in
        # Apple's production environment regardless of the entitlement value.
        Release:
          PACKWISE_API_BASE_URL: https://packwiseapp-api.vercel.app
          PACKWISE_REQUIRE_ATTESTATION: "YES"
          PACKWISE_APPATTEST_ENV: production
    # An explicit Info.plist, because GENERATE_INFOPLIST_FILE only injects keys
    # Xcode recognises — custom INFOPLIST_KEY_* settings are silently dropped.
    # These values are build-setting substitutions resolved per configuration.
    info:
      path: PackWise/Info.plist
      properties:
        CFBundleDisplayName: PackWise
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSWeatherKitUsageDescription: PackWise uses the forecast for your trip dates to suggest what to pack.
        PACKWISE_API_BASE_URL: $(PACKWISE_API_BASE_URL)
        PACKWISE_REQUIRE_ATTESTATION: $(PACKWISE_REQUIRE_ATTESTATION)
    entitlements:
      path: PackWise/PackWise.entitlements
      properties:
        com.apple.developer.weatherkit: true
        # Per configuration: Debug attests in Apple's development environment,
        # Release in production. TestFlight and the App Store use production
        # regardless of this value, which is why the server's expected
        # environment is configured per deployment rather than inferred.
        com.apple.developer.devicecheck.appattest-environment: $(PACKWISE_APPATTEST_ENV)
    dependencies:
      - sdk: WeatherKit.framework
      - sdk: CoreLocation.framework
      - sdk: DeviceCheck.framework
  PackWiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PackWiseTests
    dependencies:
      - target: PackWise
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.packwiseapp.app.tests
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
schemes:
  PackWise:
    build:
      targets:
        PackWise: all
        PackWiseTests: [test]
    test:
      targets:
        - PackWiseTests
