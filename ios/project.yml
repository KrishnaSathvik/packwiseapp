name: PackWise
options:
  bundleIdPrefix: com.packwise
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  MARKETING_VERSION: 0.1.0
  CURRENT_PROJECT_VERSION: 1
  SWIFT_VERSION: "6.0"
  IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  PackWise:
    type: application
    platform: iOS
    sources:
      - path: PackWise
      - path: ../shared/catalog
        group: Shared/Catalog
        buildPhase: resources
        includes:
          - "*.json"
      - path: ../shared/rules
        group: Shared/Rules
        buildPhase: resources
        includes:
          - "*.json"
      - path: ../shared/fixtures
        group: Shared/Fixtures
        buildPhase: resources
        includes:
          - "**/*.json"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.packwise.app
      PRODUCT_NAME: PackWise
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: PackWise
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_NSWeatherKitUsageDescription: PackWise uses the forecast for your trip dates to suggest what to pack.
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      CODE_SIGN_STYLE: Automatic
    entitlements:
      path: PackWise/PackWise.entitlements
      properties:
        com.apple.developer.weatherkit: true
    dependencies:
      - sdk: WeatherKit.framework
      - sdk: CoreLocation.framework
      - sdk: DeviceCheck.framework
  PackWiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PackWiseTests
    dependencies:
      - target: PackWise
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.packwise.app.tests
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
schemes:
  PackWise:
    build:
      targets:
        PackWise: all
        PackWiseTests: [test]
    test:
      targets:
        - PackWiseTests
